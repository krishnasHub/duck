[project]
name = "duck"
version = "0.1.0"
description = "Offline rubber duck confidant: persona fine-tuning prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "peft>=0.15",
    "accelerate>=1.6",
    "safetensors",
    "piper-tts>=1.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
